name: Validate and deploy AMAN.C production shell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site files and scripts
        run: node scripts/validate.mjs
      - name: Run unit and contract tests
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          AMAN_REQUIRE_BROWSER: "1"
        run: node --test --test-timeout=60000 tests/browser.test.js tests/browser-admin.test.js tests/browser-client.test.js

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare production shell without simulation
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R client admin styles services dist/
          test ! -e dist/simulation
          ! grep -R '__AMAN_SIMULATION__\|simulation-adapter.js' dist/client dist/admin
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
