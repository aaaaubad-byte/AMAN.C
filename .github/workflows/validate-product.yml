name: Validate AMAN product branch
on:
  push:
    branches: [feature/real-product-foundation, feature/phase-1-app-shell]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate product files and scripts
        run: node scripts/validate.mjs
