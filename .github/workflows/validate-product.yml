name: Validate AMAN product branch
on:
  push:
    branches: [feature/aman-c-complete-development, feature/real-product-foundation, feature/phase-1-app-shell, feature/phase-3-admin-a1-a4, feature/demo-mode-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate product files and scripts
        run: node scripts/validate.mjs
      - name: Run unit and contract tests
        run: node --test tests/*.test.js tests/*.test.mjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          AMAN_REQUIRE_BROWSER: "1"
        run: node --test --test-timeout=60000 tests/browser.test.js tests/browser-admin.test.js tests/browser-client.test.js
