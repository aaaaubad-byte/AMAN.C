<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101419"><title>أمان | تسجيل العميل</title><link rel="stylesheet" href="../styles/app.css"></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">AMAN | أمان حماية وضمان</div><h1>إنشاء حساب عميل</h1></div><a class="button secondary" href="../">الرئيسية</a></header>
<p class="muted">هذه شاشة مؤقتة لاختبار وصول بيانات التسجيل إلى واجهة الإدارة.</p>
<section class="card"><form id="register-form">
<div class="field"><label for="full-name">الاسم الكامل</label><input id="full-name" name="name" autocomplete="name" maxlength="80" required placeholder="اكتب اسمًا تجريبيًا"></div>
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" maxlength="20" required placeholder="رقم تجريبي"></div>
<button class="button primary" type="submit">تسجيل العميل التجريبي</button><p id="message" class="status" role="status" aria-live="polite"></p>
</form></section>
<div class="notice">وضع اختبار فقط: لا تدخل كلمة مرور أو بيانات شخصية حقيقية. البيانات تحفظ في متصفح هذا الجهاز ويمكن حذفها عند انتهاء الاختبار.</div>
</main><script type="module" src="./app.js"></script></body></html>
